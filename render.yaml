# ------------------------------------------------------------------
# Nourish Studio — Render blueprint
# Deploy: Dashboard → New → Blueprint → select this repository.
# Database: Supabase free Postgres (set DATABASE_URL when prompted).
# Render creates the web service and the cron job.
#
# Supabase connection string: Dashboard → Project → Connect →
# Transaction pooler (port 6543). Example:
#   postgresql://postgres.<ref>:<password>@aws-1-<region>.pooler.supabase.com:6543/postgres
# ------------------------------------------------------------------

services:
  # ------------------------------------------------------------------
  # Web dashboard + REST API
  # ------------------------------------------------------------------
  - type: web
    name: nourish-studio
    runtime: node
    plan: starter         # Free instances sleep; the cron job keeps automation independent.
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.11.0"
      - key: NODE_ENV
        value: production
      # Supabase Postgres connection string (paste it in the Render dashboard).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false"    # The Render Cron Job is the authoritative scheduler.
      # Public URL of this service (used for OAuth callbacks and image links).
      - key: APP_URL
        sync: false
      # Optional bootstrap admin (otherwise use the setup wizard).
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Gemini (can also be saved from the dashboard after deploy).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      # Cloudflare Workers AI (free food photography; can also be saved in the dashboard).
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      # Google / Blogger OAuth (can also be saved from the dashboard).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Pinterest OAuth (can also be saved from the dashboard).
      - key: PINTEREST_CLIENT_ID
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false
      - key: PINTEREST_REDIRECT_URI
        sync: false
      # Cloudinary (can also be saved from the dashboard).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Nutrition provider
      - key: NUTRITION_PROVIDER
        value: builtin
      - key: NUTRITION_API_KEY
        sync: false

  # ------------------------------------------------------------------
  # Scheduled automation worker
  # Runs every 15 minutes, honours the configured posting slots, prevents
  # duplicate runs in the database, then exits.
  # ------------------------------------------------------------------
  - type: cron
    name: nourish-automation
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/15 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node server.js worker
    envVars:
      - key: NODE_VERSION
        value: "24.11.0"
      - key: NODE_ENV
        value: production
      # Must be the same database as the web service.
      - key: DATABASE_URL
        fromService:
          type: web
          name: nourish-studio
          envVarKey: DATABASE_URL
      # Must match the web service so DB-encrypted API secrets can be decrypted.
      - key: SESSION_SECRET
        fromService:
          type: web
          name: nourish-studio
          envVarKey: SESSION_SECRET
      - key: APP_URL
        fromService:
          type: web
          name: nourish-studio
          envVarKey: APP_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false"
