<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d0b" />
  <meta name="description" content="Nourish Studio — AI healthy food content automation for Blogger and Pinterest." />
  <title>Nourish Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c7f464'/%3E%3Cpath d='M16 7c5 2 7 6 6 11-5 1-9-2-10-7 1-2 2-3 4-4z' fill='%23151f0c'/%3E%3Cpath d='M16 25c-3-5-2-9 2-12' stroke='%23151f0c' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="currentColor" stroke-opacity=".18" stroke-width="2"/><path d="M32 14c10 4 14 12 12 22-10 2-18-4-20-14 2-4 4-6 8-8z" fill="currentColor"/><path d="M32 50c-6-10-4-18 4-24" stroke="#10170b" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <p>Preparing your studio…</p>
  </div>

  <div id="authRoot" class="auth-root hidden"></div>

  <div id="appShell" class="shell hidden">
    <div id="navScrim" class="nav-scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none"><path d="M32 12c11 5 16 14 13 25-11 2-20-4-23-15 2-5 5-8 10-10z" fill="currentColor"/><path d="M32 52c-7-11-5-21 4-28" stroke="#131c0c" stroke-width="3.5" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name" id="brandName">Nourish Studio</span>
          <span class="brand-sub">AI food automation</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close navigation">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <button class="auto-pill" id="autoPill" title="Toggle automation">
          <span class="dot" id="autoDot"></span>
          <span class="auto-copy">
            <strong id="autoLabel">Automation off</strong>
            <small id="autoMeta">Tap to configure</small>
          </span>
          <span class="auto-switch" id="autoSwitch" aria-hidden="true"></span>
        </button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">A</div>
          <div class="user-meta">
            <strong id="userName">Admin</strong>
            <small>Owner</small>
          </div>
          <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="page-heading">
          <span class="eyebrow" id="pageEyebrow">Studio</span>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="conn-dots" id="connDots" title="Connection status"></div>
          <button class="btn ghost hide-sm" id="quickPostNow">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>
            Post now
          </button>
          <button class="btn primary" id="quickNew">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            New post
          </button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
